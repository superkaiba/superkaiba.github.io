name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build project catalogue
        run: |
          python -m pip install -r scripts/projects-requirements.txt
          python scripts/build_projects.py

      - name: Build link previews
        run: |
          python -m pip install -r scripts/link-preview-requirements.txt
          python scripts/build_link_previews.py

      - name: Restore newsletter previews
        uses: actions/cache@v4
        with:
          path: .cache/substack
          key: substack-previews-${{ github.run_id }}
          restore-keys: substack-previews-

      - name: Refresh newsletter previews
        run: python scripts/build_blog.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # Deploy in its own job, as the deploy-pages README recommends. When the
  # deploy step ran right after the upload in the same job, GitHub sometimes
  # had not registered the artifact yet ("Found 0 artifact(s)"). A separate
  # job also lets a failed deploy be re-run without uploading a duplicate.
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
